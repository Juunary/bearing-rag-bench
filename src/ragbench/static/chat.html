<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bearing-rag-bench</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#dcdcd6; --accent:#2a5bd7; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#ececea; --muted:#9a9a94; --card:#202020; --line:#333; --accent:#7ba2ff; --warn:#e0a040; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 system-ui, "Noto Sans KR", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100vh; }
  h1 { font-size:17px; margin:8px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  #log { flex:1; display:flex; flex-direction:column; gap:12px; padding-bottom:12px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; max-width:100%; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-color:transparent; max-width:85%; }
  .msg.blocked { border-color:var(--warn); }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  .cite { color:var(--accent); cursor:pointer; text-decoration:underline; font-size:13px; }
  details { margin-top:8px; font-size:13px; }
  details pre { white-space:pre-wrap; margin:6px 0 0; color:var(--muted); }
  form { position:sticky; bottom:0; display:flex; gap:8px; padding:12px 0 16px; background:var(--bg); }
  textarea { flex:1; resize:none; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); font:inherit; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<main>
  <h1>bearing-rag-bench</h1>
  <div class="sub" id="sub">연결 확인 중…</div>
  <div id="log"></div>
  <form id="form">
    <textarea id="q" rows="2" placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)" autofocus></textarea>
    <button id="send" type="submit">보내기</button>
  </form>
</main>
<script>
const log = document.getElementById("log"), form = document.getElementById("form"),
      q = document.getElementById("q"), send = document.getElementById("send");
const CITE = /\[([A-Za-z0-9_]+#\d+)\]/g;

// 서버 상태 표시: 모델·프롬프트 버전·컨텍스트 개수 (대화 기억은 없다는 점도 같이 알린다)
fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("sub").textContent =
    `${h.model} · ${h.prompt_version} · 컨텍스트 ${h.context_k}개 · 질문마다 독립적으로 답합니다(대화 기억 없음)`;
}).catch(() => { document.getElementById("sub").textContent = "서버에 연결할 수 없습니다"; });

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;       // textContent만 사용해 답변에 HTML이 섞여도 실행되지 않는다
  log.appendChild(d); d.scrollIntoView({block: "end"});
  return d;
}

// 답변 속 [청크ID]를 눌러 볼 수 있는 인용으로 바꾼다 (DOM으로 만들어 HTML 주입을 피한다)
function render(div, data) {
  div.textContent = "";
  let last = 0;
  for (const m of data.answer.matchAll(CITE)) {
    div.append(data.answer.slice(last, m.index));
    const a = document.createElement("span");
    a.className = "cite"; a.textContent = m[0];
    a.onclick = () => { const el = div.querySelector(`[data-id="${m[1]}"]`); if (el) { el.open = true; el.scrollIntoView({block: "center"}); } };
    div.append(a); last = m.index + m[0].length;
  }
  div.append(data.answer.slice(last));
  if (data.blocked) div.classList.add("blocked");
  const meta = document.createElement("div"); meta.className = "meta";
  const t = data.timings_ms;
  meta.textContent = `${data.blocked ? "차단: " + data.reason + " · " : ""}${data.lang} · 검색 ${t.retrieve ?? 0}ms · 생성 ${t.generate ?? 0}ms${data.cache_hit ? " (캐시)" : ""} · 전체 ${t.total}ms`;
  div.append(meta);
  for (const c of data.contexts) {
    const det = document.createElement("details"); det.dataset.id = c.chunk_id;
    const sum = document.createElement("summary"); sum.textContent = c.chunk_id;
    const pre = document.createElement("pre"); pre.textContent = c.text;
    det.append(sum, pre); div.append(det);
  }
}

async function ask() {
  const question = q.value.trim();
  if (!question) return;
  add("user", question); q.value = ""; send.disabled = true;
  const pending = add("bot", "생각 중… (앞선 요청이 있으면 순서를 기다립니다)");
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question})});
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(pending, await r.json());
  } catch (e) { pending.textContent = "요청 실패: " + e.message; pending.classList.add("blocked"); }
  send.disabled = false; q.focus();
}
form.addEventListener("submit", e => { e.preventDefault(); ask(); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });   // 한글 조합 중 Enter는 무시
</script>
</body>
</html>
