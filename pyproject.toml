[project]
name = "ragbench"
version = "0.1.0"
description = "Multilingual (ko/en/de) technical-document RAG retrieval & generation quality experiments, implemented without RAG frameworks"
authors = [{ name = "Juunary" }]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "bm25s>=0.3.13",
    "hnswlib>=0.8.0",
    "kiwipiepy>=0.24.0",
    "numpy>=2.5.4",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# This machine's NVIDIA driver is 550 (CUDA 12.4). Default PyPI torch wheels are CUDA 13 builds,
# which that driver cannot load, so torch is pinned to the official CUDA 12.6 index
# (CUDA 12.x minor-version compatibility covers driver >= 525).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
